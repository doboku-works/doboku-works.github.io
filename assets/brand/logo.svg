<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1d36"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="topFace" x1="14" y1="14" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="12" y1="22" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="32" y1="22" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="30" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="rightClip">
      <polygon points="51,22 32,32 32,52 51,42"/>
    </clipPath>
  </defs>

  <!-- Rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.6"/>

  <!-- Subtle blueprint grid -->
  <path d="M16 4V60M32 4V60M48 4V60M4 16H60M4 32H60M4 48H60" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Isometric 3D Civil Engineering Cube / Truss Cutaway -->
  <!-- Top deck face -->
  <polygon points="32,12 51,22 32,32 13,22" fill="url(#topFace)"/>
  <!-- Left geological / structural face -->
  <polygon points="13,22 32,32 32,52 13,42" fill="url(#leftFace)"/>
  <!-- Left cutaway strata lines -->
  <path d="M13,29.5 L32,39.5" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="1.3"/>
  <path d="M13,36 L32,46" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.3"/>

  <!-- Right cutaway / structural truss face -->
  <polygon points="51,22 32,32 32,52 51,42" fill="url(#rightFace)"/>
  <!-- Orange structural FEM / truss diagonals -->
  <g clip-path="url(#rightClip)">
    <path d="M32,32 L51,42 M32,52 L51,22" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,42 L51,32" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.4"/>
  </g>

  <!-- Crisp wireframe outer edges -->
  <polygon points="32,12 51,22 51,42 32,52 13,42 13,22" stroke="#bae6fd" stroke-opacity="0.82" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M32,32 V52 M13,22 L32,32 L51,22" stroke="#e0f2fe" stroke-opacity="0.65" stroke-width="1.15" stroke-linejoin="round"/>

  <!-- Top node highlight -->
  <circle cx="32" cy="12" r="2.2" fill="#f8fafc"/>
  <circle cx="32" cy="32" r="2.1" fill="#fb923c"/>
</svg>
